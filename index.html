<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Media Analytics | VALUE CODERS</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--primary:#2563eb;--primary2:#1d4ed8;--soft:#eff6ff;--success:#12b76a;--danger:#f04438;--warn:#f79009}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#101828;color:#fff;padding:22px 16px;position:fixed;left:0;top:0;bottom:0}.brand{font-weight:800;font-size:18px;margin:0 8px 3px}.brand-sub{color:#98a2b3;font-size:12px;margin:0 8px 24px}.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px 12px;border-radius:9px;margin:4px 0;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:#1d2939;color:#fff}.footer{position:absolute;bottom:20px;left:24px;color:#667085;font-size:11px}
.main{margin-left:250px;width:calc(100% - 250px);padding:28px;max-width:1500px}.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:22px}.hero h1{font-size:29px;margin:0 0 6px}.hero p{margin:0;color:var(--muted)}
.page{display:none}.page.active{display:block}.section-title{font-size:20px;font-weight:750;margin:8px 0 12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}.metric-label{font-size:12px;color:var(--muted)}.metric-value{font-size:25px;font-weight:800;margin-top:6px}.metric-note{font-size:11px;color:var(--muted);margin-top:5px}.chart-card{min-height:350px}.card h3{font-size:16px;margin:0 0 13px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{background:#f9fafb;color:#475467;font-weight:650}.table tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--primary2);font-size:12px;font-weight:650}.info{padding:12px 14px;border-radius:10px;background:#f0f9ff;border:1px solid #bae6fd;color:#075985;font-size:13px;margin-bottom:15px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;color:#475467;margin-bottom:6px}.field input,.field select{width:100%;padding:10px 11px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;font-size:14px}.btn{border:0;background:var(--primary);color:#fff;border-radius:8px;padding:10px 15px;font-weight:650;cursor:pointer}.btn:hover{background:var(--primary2)}.btn.secondary{background:#fff;color:#344054;border:1px solid #d0d5dd}.actions{display:flex;gap:9px;margin-top:15px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.select{padding:9px 11px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.network{height:430px;position:relative;background:#fbfcfe;border:1px solid var(--line);border-radius:12px;overflow:hidden}.node{position:absolute;width:90px;height:50px;border-radius:12px;background:#fff;border:2px solid #2563eb;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;box-shadow:0 5px 16px #10182812}.edge{position:absolute;height:2px;background:#98a2b3;transform-origin:left center}.legend{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:900px){.sidebar{width:100%;height:auto;position:static;padding:12px}.app{display:block}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.footer{display:none}.main{margin-left:0;width:100%;padding:15px}.grid4,.grid3,.grid2,.form-grid{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand">Social Media Analytics</div><div class="brand-sub">VALUE CODERS • SIH26152</div><nav class="nav" id="nav"></nav><div class="footer">Prototype • Static web version</div></aside>
<main class="main"><div class="hero"><h1>Social Media Analytics</h1><p>Unified analytics prototype for sentiment, trends, audience insights and influence mapping.</p></div>
<section id="dashboard" class="page active"></section><section id="sentiment" class="page"></section><section id="audience" class="page"></section><section id="network" class="page"></section><section id="detailed" class="page"></section><section id="input" class="page"></section>
</main></div>
<script>
const initial=[
['2026-01-05','Instagram',8200,24000,2100,180,320,62,18,20,'Product'],['2026-01-12','YouTube',5400,18000,1450,110,210,58,22,20,'Video'],['2026-01-19','Instagram',8750,27000,2400,205,380,65,16,19,'Product'],['2026-01-26','Facebook',4100,12000,950,70,120,52,28,20,'Campaign'],['2026-02-02','YouTube',6100,22000,1800,140,260,61,20,19,'Video'],['2026-02-09','Instagram',9300,31000,2750,230,410,68,14,18,'Product'],['2026-02-16','Facebook',4550,15000,1100,85,150,55,25,20,'Campaign'],['2026-02-23','YouTube',6800,25000,2050,155,300,63,19,18,'Video'],['2026-03-02','Instagram',10100,36000,3300,290,520,71,12,17,'Product'],['2026-03-09','Facebook',4900,17000,1250,95,180,57,24,19,'Campaign'],['2026-03-16','YouTube',7350,29000,2400,180,340,66,15,19,'Video'],['2026-03-23','Instagram',11000,41000,3900,320,610,74,10,16,'Product']];
let data=JSON.parse(localStorage.getItem('sma_data')||'null'); if(!data)data=initial.map(r=>row(r));
function row(r){return {date:r[0],platform:r[1],followers:+r[2],reach:+r[3],likes:+r[4],comments:+r[5],shares:+r[6],positive:+r[7],negative:+r[8],neutral:+r[9],topic:r[10]}}
const navItems=[['dashboard','Dashboard'],['sentiment','Sentiment & Trends'],['audience','Audience Insights'],['network','Influence & Network'],['detailed','Detailed Analysis'],['input','Data Input']];
document.getElementById('nav').innerHTML=navItems.map(([id,t])=>`<button data-page="${id}">${t}</button>`).join('');
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));
let charts={}; function fmt(n){return Number(n).toLocaleString('en-IN')}; function sum(key,arr=data){return arr.reduce((a,x)=>a+(+x[key]||0),0)} function engagement(x){return x.likes+x.comments+x.shares}
function destroy(id){if(charts[id]){charts[id].destroy();delete charts[id]}}
function chart(id,type,labels,datasets,opts={}){destroy(id);const c=document.getElementById(id);if(!c)return;charts[id]=new Chart(c,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'}},scales:type==='pie'?{}:{y:{beginAtZero:true}},...opts}})}
function card(label,value,note=''){return `<div class="card"><div class="metric-label">${label}</div><div class="metric-value">${value}</div>${note?`<div class="metric-note">${note}</div>`:''}</div>`}
function renderDashboard(){const el=document.getElementById('dashboard');const totalReach=sum('reach');const totalEng=data.reduce((a,x)=>a+engagement(x),0);const avg=data.reduce((a,x)=>a+x.positive,0)/data.length;let topics={};data.forEach(x=>topics[x.topic]=(topics[x.topic]||0)+x.reach);el.innerHTML=`<div class="section-title">Overview</div><div class="grid4">${card('Total followers',fmt(data[data.length-1].followers),'Latest recorded value')}${card('Total reach',fmt(totalReach),'Across all records')}${card('Total engagement',fmt(totalEng),'Likes + comments + shares')}${card('Avg. positive sentiment',avg.toFixed(1)+'%','Across sample records')}</div><div class="grid2" style="margin-top:14px"><div class="card chart-card"><h3>Reach over time</h3><div style="height:280px"><canvas id="reachChart"></canvas></div></div><div class="card chart-card"><h3>Engagement by platform</h3><div style="height:280px"><canvas id="engChart"></canvas></div></div></div><div class="card" style="margin-top:14px"><h3>Top topics</h3><div class="table-wrap"><table class="table"><thead><tr><th>Topic</th><th>Reach</th></tr></thead><tbody>${Object.entries(topics).sort((a,b)=>b[1]-a[1]).map(x=>`<tr><td><span class="pill">${x[0]}</span></td><td>${fmt(x[1])}</td></tr>`).join('')}</tbody></table></div></div>`;chart('reachChart','line',data.map(x=>x.date),[{label:'Reach',data:data.map(x=>x.reach),tension:.3,fill:true}],{plugins:{legend:{display:false}}});let p={};data.forEach(x=>p[x.platform]=(p[x.platform]||0)+engagement(x));chart('engChart','bar',Object.keys(p),[{label:'Engagement',data:Object.values(p),borderRadius:7}],{plugins:{legend:{display:false}}})}
function renderSentiment(){const el=document.getElementById('sentiment');let topic={};data.forEach(x=>{topic[x.topic]??={mentions:0,reach:0};topic[x.topic].mentions++;topic[x.topic].reach+=x.reach});el.innerHTML=`<div class="topbar"><div class="section-title">Sentiment Analysis</div></div><div class="card chart-card"><h3>Sentiment trend</h3><div style="height:300px"><canvas id="sentChart"></canvas></div></div><div class="card" style="margin-top:14px"><h3>Emerging topics</h3><div class="table-wrap"><table class="table"><thead><tr><th>Topic</th><th>Mentions</th><th>Reach</th></tr></thead><tbody>${Object.entries(topic).sort((a,b)=>b[1].reach-a[1].reach).map(([k,v])=>`<tr><td>${k}</td><td>${v.mentions}</td><td>${fmt(v.reach)}</td></tr>`).join('')}</tbody></table></div></div><div class="card chart-card" style="margin-top:14px"><h3>Timeline analysis</h3><div style="height:270px"><canvas id="timeChart"></canvas></div></div>`;chart('sentChart','line',data.map(x=>x.date),[{label:'Positive',data:data.map(x=>x.positive),tension:.3},{label:'Negative',data:data.map(x=>x.negative),tension:.3},{label:'Neutral',data:data.map(x=>x.neutral),tension:.3}],{scales:{y:{beginAtZero:true,max:100,title:{display:true,text:'Sentiment (%)')}}});chart('timeChart','bar',data.map(x=>x.date),[{label:'Reach',data:data.map(x=>x.reach),borderRadius:6}],{plugins:{legend:{display:false}}})}
function renderAudience(){const el=document.getElementById('audience');el.innerHTML=`<div class="section-title">Audience Insights</div><div class="info">Prototype view using sample data. Demographic categories can be connected to approved datasets later.</div><div class="grid3">${card('Primary age group','18–24')}${card('Top region','India')}${card('Active period','Evening')}</div><div class="grid2" style="margin-top:14px"><div class="card chart-card"><h3>Audience profile</h3><div style="height:280px"><canvas id="demoChart"></canvas></div></div><div class="card chart-card"><h3>Platform distribution</h3><div style="height:280px"><canvas id="platformChart"></canvas></div></div></div>`;chart('demoChart','bar',['13–17','18–24','25–34','35–44','45+'],[{label:'Audience share',data:[12,38,29,14,7],borderRadius:7}],{plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:'Share (%)'}}}});let p={};data.forEach(x=>p[x.platform]=Math.max(p[x.platform]||0,x.followers));chart('platformChart','doughnut',Object.keys(p),[{label:'Followers',data:Object.values(p)}],{cutout:'55%'})}
function renderNetwork(){const el=document.getElementById('network');const pos={brand:[50,18],a:[25,40],b:[75,40],news:[83,68],community:[17,68],audience:[50,87]};const edges=[['brand','a'],['brand','b'],['a','community'],['b','news'],['news','audience'],['community','audience']];const names={brand:'Brand',a:'Creator A',b:'Creator B',news:'News Page',community:'Community',audience:'Audience'};el.innerHTML=`<div class="section-title">Influence & Network Mapping</div><div class="card"><div class="network">${edges.map(([a,b])=>line(pos[a],pos[b])).join('')}${Object.entries(pos).map(([k,v])=>`<div class="node" style="left:calc(${v[0]}% - 45px);top:calc(${v[1]}% - 25px)">${names[k]}</div>`).join('')}</div><div class="legend">Illustrative prototype visualization based on sample relationships.</div></div><div class="card" style="margin-top:14px"><h3>Influential nodes</h3><div class="table-wrap"><table class="table"><thead><tr><th>Node</th><th>Influence score</th></tr></thead><tbody>${[['Brand',92],['Creator A',84],['Creator B',77],['News Page',69],['Community',61]].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</tbody></table></div></div>`}function line(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx)*180/Math.PI;return `<div class="edge" style="left:${a[0]}%;top:${a[1]}%;width:${len}%;transform:rotate(${ang}deg)"></div>`}
function renderDetailed(){const topics=[...new Set(data.map(x=>x.topic))],plats=[...new Set(data.map(x=>x.platform))];document.getElementById('detailed').innerHTML=`<div class="topbar"><div class="section-title">Analyst Drill-down</div><div><select id="topicSel" class="select"><option>All topics</option>${topics.map(x=>`<option>${x}</option>`).join('')}</select> <select id="platSel" class="select"><option>All platforms</option>${plats.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div id="detailBody"></div>`;document.getElementById('topicSel').onchange=renderDetailBody;document.getElementById('platSel').onchange=renderDetailBody;renderDetailBody()}
function renderDetailBody(){let t=document.getElementById('topicSel').value,p=document.getElementById('platSel').value;let f=data.filter(x=>(t==='All topics'||x.topic===t)&&(p==='All platforms'||x.platform===p));document.getElementById('detailBody').innerHTML=`<div class="grid3">${card('Reach',fmt(sum('reach',f)))}${card('Likes',fmt(sum('likes',f)))}${card('Comments',fmt(sum('comments',f)))}</div><div class="card" style="margin-top:14px"><h3>Selected records</h3><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Platform</th><th>Topic</th><th>Followers</th><th>Reach</th><th>Likes</th><th>Comments</th><th>Shares</th></tr></thead><tbody>${f.map(x=>`<tr><td>${x.date}</td><td>${x.platform}</td><td>${x.topic}</td><td>${fmt(x.followers)}</td><td>${fmt(x.reach)}</td><td>${fmt(x.likes)}</td><td>${fmt(x.comments)}</td><td>${fmt(x.shares)}</td></tr>`).join('')||'<tr><td colspan="8">No matching records.</td></tr>'}</tbody></table></div></div><div class="card chart-card" style="margin-top:14px"><h3>Reach timeline</h3><div style="height:260px"><canvas id="detailChart"></canvas></div></div>`;chart('detailChart','line',f.map(x=>x.date),[{label:'Reach',data:f.map(x=>x.reach),tension:.3,fill:true}],{plugins:{legend:{display:false}}})}
function renderInput(){document.getElementById('input').innerHTML=`<div class="section-title">Data Input</div><div class="info">Enter a simple record to add to the prototype dataset. Added records are saved in this browser using local storage.</div><div class="card"><form id="form"><div class="form-grid"><div class="field"><label>Date</label><input id="date" type="date" required value="2026-03-24"></div><div class="field"><label>Platform</label><select id="platform"><option>Instagram</option><option>YouTube</option><option>Facebook</option><option>X</option></select></div><div class="field"><label>Followers</label><input id="followers" type="number" min="0" value="1000"></div><div class="field"><label>Reach</label><input id="reach" type="number" min="0" value="5000"></div><div class="field"><label>Likes</label><input id="likes" type="number" min="0" value="300"></div><div class="field"><label>Comments</label><input id="comments" type="number" min="0" value="30"></div><div class="field"><label>Shares</label><input id="shares" type="number" min="0" value="50"></div><div class="field"><label>Topic</label><input id="topic" value="Product"></div></div><div class="actions"><button class="btn" type="submit">Add data</button><button class="btn secondary" type="button" id="reset">Reset sample data</button><button class="btn secondary" type="button" id="csv">Download CSV</button></div></form></div><div class="card" style="margin-top:14px"><h3>Current prototype data</h3><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Platform</th><th>Followers</th><th>Reach</th><th>Likes</th><th>Comments</th><th>Shares</th><th>Topic</th></tr></thead><tbody>${data.map(x=>`<tr><td>${x.date}</td><td>${x.platform}</td><td>${fmt(x.followers)}</td><td>${fmt(x.reach)}</td><td>${fmt(x.likes)}</td><td>${fmt(x.comments)}</td><td>${fmt(x.shares)}</td><td>${x.topic}</td></tr>`).join('')}</tbody></table></div></div>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();data.push({date:date.value,platform:platform.value,followers:+followers.value,reach:+reach.value,likes:+likes.value,comments:+comments.value,shares:+shares.value,positive:60,negative:20,neutral:20,topic:topic.value||'Product'});save();renderInput()};document.getElementById('reset').onclick=()=>{data=initial.map(r=>row(r));save();renderInput()};document.getElementById('csv').onclick=()=>downloadCSV()}
function save(){localStorage.setItem('sma_data',JSON.stringify(data));renderAll()}
function downloadCSV(){const h=['date','platform','followers','reach','likes','comments','shares','positive','negative','neutral','topic'];const csv=[h.join(','),...data.map(x=>h.map(k=>`"${String(x[k]).replaceAll('"','""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='social_media_analytics_data.csv';a.click()}
function renderAll(){renderDashboard();renderSentiment();renderAudience();renderNetwork();renderDetailed();renderInput()}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));renderAll()}
renderAll();show('dashboard');
</script></body></html>
